{% extends "admin/base_site.html" %}

{% block footer_scripts %}
    {{ block.super }}
    <script>
        (function($) {
            /**
             * 1. SYSTEM CLOCK & UI ENHANCEMENT
             * Injects a live ticking forensic clock into the Jazzmin/Admin user panel.
             */
            function updateTime() {
                const now = new Date();
                const options = { 
                    weekday: 'long', year: 'numeric', month: 'long', 
                    day: 'numeric', hour: '2-digit', minute: '2-digit', second: '2-digit' 
                };
                const timeString = now.toLocaleDateString('en-GB', options);
                
                const userPanel = document.querySelector('.user-panel');
                if (userPanel) {
                    let timeDiv = document.getElementById('live-time');
                    if (!timeDiv) {
                        timeDiv = document.createElement('div');
                        timeDiv.id = 'live-time';
                        timeDiv.style.padding = '10px';
                        timeDiv.style.color = '#4ecca3';
                        timeDiv.style.fontSize = '12px';
                        timeDiv.style.fontWeight = 'bold';
                        userPanel.appendChild(timeDiv);
                    }
                    timeDiv.innerHTML = "🕒 " + timeString;
                }
            }

            /**
             * 2. FORENSIC STATUS OBSERVER & UI UPDATER
             * Polls the server for the results and updates the Django Admin UI components.
             */
            function startPolling(evidenceId) {
                console.log("Forensic Monitoring Active for Exhibit: " + evidenceId);
                
                const statusInterval = setInterval(async () => {
                    try {
                        const response = await fetch(`/evidence/status/${evidenceId}/`);
                        
                        if (!response.ok) throw new Error("Network response was not ok");
                        
                        const data = await response.json();

                        // TARGET 1: Standard ID elements (Custom Templates)
                        const statusElement = document.getElementById('integrity-status-display');
                        const detailElement = document.getElementById('tamper-details-display');

                        // TARGET 2: Django Admin Readonly Fields (Standard Admin UI)
                        const $adminStatusField = $('.field-integrity_status .readonly');
                        const $adminDetailField = $('.field-tamper_details .readonly');

                        if (data.status === "FAILED" || data.status === "TAMPERED") {
                            // --- Update Custom UI ---
                            if (statusElement) {
                                statusElement.style.color = "#e74c3c";
                                statusElement.style.fontWeight = "bold";
                                statusElement.innerHTML = "⚠️ TAMPERING DETECTED";
                            }

                            // --- Update Standard Admin UI (jQuery) ---
                            if ($adminStatusField.length) {
                                $adminStatusField.html(`<b style="color:#e74c3c">⚠️ TAMPERED: ${data.details}</b>`);
                            }
                            if ($adminDetailField.length) {
                                $adminDetailField.text(data.details);
                            }

                            // --- Attention Grabbing: Flash the General Information Tab ---
                            $('.nav-tabs a[href="#general-information"]').css({
                                'background-color': '#ff4b2b',
                                'color': '#ffffff',
                                'transition': 'background 0.5s ease'
                            });

                            // Stop polling once failure is confirmed
                            clearInterval(statusInterval); 
                        } 
                        else if (data.status === "INTACT" || data.status === "VERIFIED") {
                            if (statusElement) {
                                statusElement.style.color = "#2ecc71";
                                statusElement.style.fontWeight = "bold";
                                statusElement.innerHTML = "✅ INTEGRITY VERIFIED";
                            }
                            
                            if ($adminStatusField.length) {
                                $adminStatusField.html(`<b style="color:#2ecc71">✅ INTACT</b>`);
                            }

                            clearInterval(statusInterval);
                        }

                        // Sync details if the field exists
                        if (detailElement && data.details) {
                            detailElement.innerText = data.details;
                        }

                    } catch (error) {
                        console.error("Forensic Polling error:", error);
                    }
                }, 3000); // Poll every 3 seconds
            }

            // --- INITIALIZATION ---
            $(document).ready(function() {
                // Start Clock
                setInterval(updateTime, 1000);
                updateTime();

                // Get ID from Django Context
                // Note: 'original.id' is used in change_form, 'object_id' is used in some custom views
                const currentId = "{{ original.id|default:object_id|default:'' }}"; 
                if (currentId && currentId !== "" && currentId !== "None") {
                    startPolling(currentId);
                }
            });

        })(django.jQuery);
    </script>
{% endblock %}
